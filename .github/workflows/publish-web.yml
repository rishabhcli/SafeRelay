name: Publish web source

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
  workflow_dispatch:

concurrency:
  group: publish-saferelay-web
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out monorepo
        uses: actions/checkout@v4

      - name: Configure deployment key
        env:
          DEPLOY_KEY: ${{ secrets.SAFERELAY_WEB_DEPLOY_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/saferelay_web"
          chmod 600 "$HOME/.ssh/saferelay_web"
          ssh-keyscan -H github.com >> "$HOME/.ssh/known_hosts"

      - name: Publish web project
        env:
          GIT_SSH_COMMAND: ssh -i "$HOME/.ssh/saferelay_web" -o IdentitiesOnly=yes
        run: |
          git clone git@github.com:rishabhcli/SafeRelay-web.git publish
          rsync -a --delete \
            --exclude ".git/" \
            --exclude ".jac/" \
            --exclude ".pytest_cache/" \
            --exclude "dist/" \
            --exclude "node_modules/" \
            web/ publish/

          git -C publish config user.name "SafeRelay publisher"
          git -C publish config user.email "actions@users.noreply.github.com"
          git -C publish add --all

          if git -C publish diff --cached --quiet; then
            echo "Web source is already current."
            exit 0
          fi

          git -C publish commit -m "Publish web source from ${GITHUB_SHA}"
          git -C publish push origin main
