[project]
name = "saferelay-mobile"
version = "2.0.0"
description = "Offline-first disaster rescue relay built end to end in Jac."
entry-point = "main.jac"
kind = "mobile"
jac-version = "==0.34.7"
license = { file = "LICENSE" }
readme = "README.md"

[dependencies]

[dependencies.npm]
react = "^18.3.1"
react-dom = "^18.3.1"
react-router-dom = "^6.30.1"
react-error-boundary = "^5.0.0"
"@tanstack/react-form" = "^1.33.2"
zod = "^4.4.3"
lucide-react = "^0.468.0"
"@capacitor/core" = "^8.0.0"
"@capacitor/app" = "^8.1.1"
"@capacitor/device" = "^8.0.3"
"@capacitor/geolocation" = "^8.2.0"
"@capacitor/haptics" = "^8.0.2"
"@capacitor/local-notifications" = "^8.2.1"
"@capacitor/network" = "^8.0.1"
"@capacitor/preferences" = "^8.0.1"
"@capawesome/capacitor-torch" = "^8.0.1"
"@capgo/capacitor-bluetooth-low-energy" = "^8.2.0"

[dependencies.npm.dev]
vite = "^6.4.3"
"@vitejs/plugin-react" = "^4.7.0"
typescript = "^5.9.3"
"@types/react" = "^18.3.31"
"@types/react-dom" = "^18.3.7"
"@capacitor/cli" = "^8.0.0"

[dev-dependencies]
watchdog = ">=3.0.0"

[serve]
base_route_app = "app"
port = 8000

[client]
framework = "react"

[client.app_meta_data]
title = "SafeRelay"
description = "Offline disaster rescue mesh relay"
author = "SafeRelay Team"
theme_color = "#080b0f"
icon = "icon.png"

[client.mobile]
app_name = "SafeRelay"
app_id = "com.development.saferelay"
release = false
bundle = false
default_platform = "android"
ios_sdk = "iphonesimulator"
ios_destination = "platform=iOS Simulator,name=iPhone 16,OS=latest"

[test]
directory = "tests"
verbose = true

[check.lint]
select = ["default"]

[scripts]
check = "jac check ."
test = "jac clean --data --force && jac test -d tests -v"
web = "jac build --client web"
android = "jac build --client mobile --platform android"
ios = "jac build --client mobile --platform ios"
